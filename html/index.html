<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>amin_os</title>
    <link rel="stylesheet" href="./../style/index.css" />
    <link rel="stylesheet" href="./..//style/drag.css" />
  </head>
  <body>
    <header>
      <div id="datetime">
        <div id="timeDiv"></div>
        <div id="dateDiv"></div>
      </div>
    </header>

    <div class="bottomBar">
      <div class="file_exp item" id="file_exp_btn" onclick="show_hide()">
        <div class="file_exp_img"></div>
      </div>
      <div class="calc item">
        <div class="calc_img"></div>
      </div>
      <div class="terminal item">
        <div class="terminal_img"></div>
      </div>
      <div class="note_pad item">
        <div class="note_pad_img"></div>
      </div>
      <div class="settings item">
        <div class="settings_img"></div>
      </div>
    </div>


    
    <div class="window file_explorer" id="window">
      <div class="title-bar" id="title-bar">My Window</div>

      <div class="window-content">Window content here</div>
    </div>
 

  </body>

  

  <script src="./../js/index.js"></script>
  <script src="./../js/drag.js"></script>
</html>
